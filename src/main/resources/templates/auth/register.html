<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Регистрация — CourseRPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow p-4" style="min-width:360px">
        <h4 class="card-title text-center mb-4">Регистрация</h4>
        <form th:action="@{/auth/register}" method="post">
            <div class="mb-3">
                <label for="login" class="form-label">Логин</label>
                <input type="text" id="login" name="login" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required/>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Роль</label>
                <select id="role" name="role" class="form-select" required>
                    <option th:each="r : ${roles}" th:value="${r.name()}"
                            th:text="${r.getName() + ' (' + r.name() + ')'}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/auth/login}">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
