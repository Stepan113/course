<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Добавить карту — CourseRPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CourseRPP</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/cards}">Карты</a>
            <a class="nav-link" th:href="@{/scores}">Счета</a>
            <a class="nav-link" th:href="@{/cash-withdrawals}">Снятие наличных</a>
            <a class="nav-link" th:href="@{/money-transfers}">Переводы</a>
            <a class="nav-link" th:href="@{/applications}">Заявки</a>
            <a class="nav-link" th:href="@{/replenishments}">Пополнения</a>
        </div>
        <form th:action="@{/auth/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-outline-light btn-sm">Выход</button>
        </form>
    </div>
</nav>
<div class="container mt-4" style="max-width:500px">
    <h3 class="mb-3">Новая карта</h3>
    <form th:action="@{/cards/save}" th:object="${card}" method="post">
        <div class="mb-3">
            <label for="number" class="form-label">Номер карты</label>
            <input type="number" id="number" th:field="*{number}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="balance" class="form-label">Баланс</label>
            <input type="number" id="balance" th:field="*{balance}" class="form-control" min="0" required/>
        </div>
        <div class="mb-3">
            <label for="CVC" class="form-label">CVC</label>
            <input type="text" id="CVC" th:field="*{CVC}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a th:href="@{/cards}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
