<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Снятие наличных — CourseRPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CourseRPP</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/cards}">Карты</a>
            <a class="nav-link" th:href="@{/scores}">Счета</a>
            <a class="nav-link" th:href="@{/cash-withdrawals}">Снятие наличных</a>
            <a class="nav-link" th:href="@{/money-transfers}">Переводы</a>
            <a class="nav-link" th:href="@{/applications}">Заявки</a>
            <a class="nav-link" th:href="@{/replenishments}">Пополнения</a>
        </div>
        <form th:action="@{/auth/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-outline-light btn-sm">Выход</button>
        </form>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Снятие наличных</h3>
        <a th:href="@{/cash-withdrawals/new}" class="btn btn-primary">Создать</a>
    </div>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Сумма снятия</th>
            <th>Дата</th>
            <th>Заявка</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cw : ${cashWithdrawals}">
            <td th:text="${cw.withdrawalAmount}"></td>
            <td th:text="${cw.createdAt}"></td>
            <td th:text="${cw.applicationForCash != null ? cw.applicationForCash.id : '—'}"></td>
            <td>
                <a th:href="@{/cash-withdrawals/{id}/delete(id=${cw.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cashWithdrawals)}">
            <td colspan="4" class="text-center text-muted">Записи не найдены</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
