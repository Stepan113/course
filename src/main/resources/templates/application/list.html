<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Заявки — CourseRPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CourseRPP</a>
        <div class="navbar-nav">
            <a class="nav-link" sec:authorize="hasRole('EXECUTOR')" th:href="@{/cards}">Карты</a>
            <a class="nav-link" sec:authorize="hasRole('GUARANTOR')" th:href="@{/scores}">Счета</a>
            <a class="nav-link" sec:authorize="hasRole('GUARANTOR')" th:href="@{/cash-withdrawals}">Снятие наличных</a>
            <a class="nav-link" sec:authorize="hasRole('GUARANTOR')" th:href="@{/money-transfers}">Переводы</a>
            <a class="nav-link" sec:authorize="hasRole('EXECUTOR')" th:href="@{/applications}">Заявки</a>
            <a class="nav-link" sec:authorize="hasRole('EXECUTOR')" th:href="@{/replenishments}">Пополнения</a>
            <a class="nav-link" th:href="@{/reports}">Отчёты</a>
        </div>
        <form th:action="@{/auth/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-outline-light btn-sm">Выход</button>
        </form>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Заявки на снятие наличных</h3>
        <a th:href="@{/applications/new}" class="btn btn-primary">Создать</a>
    </div>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Задержка (дней)</th>
            <th>Сумма снятия</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.delay}"></td>
            <td th:text="${app.withdrawalAmount}"></td>
            <td>
                <a th:href="@{/applications/{id}/edit(id=${app.id})}" class="btn btn-sm btn-warning me-1">Изменить</a>
                <a th:href="@{/applications/{id}/delete(id=${app.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(applications)}">
            <td colspan="3" class="text-center text-muted">Заявки не найдены</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
