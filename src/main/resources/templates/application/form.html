<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Новая заявка — CourseRPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CourseRPP</a>
        <div class="navbar-nav">
            <a class="nav-link" sec:authorize="hasRole('EXECUTOR')" th:href="@{/cards}">Карты</a>
            <a class="nav-link" sec:authorize="hasRole('GUARANTOR')" th:href="@{/scores}">Счета</a>
            <a class="nav-link" sec:authorize="hasRole('GUARANTOR')" th:href="@{/cash-withdrawals}">Снятие наличных</a>
            <a class="nav-link" sec:authorize="hasRole('GUARANTOR')" th:href="@{/money-transfers}">Переводы</a>
            <a class="nav-link" sec:authorize="hasRole('EXECUTOR')" th:href="@{/applications}">Заявки</a>
            <a class="nav-link" sec:authorize="hasRole('EXECUTOR')" th:href="@{/replenishments}">Пополнения</a>
            <a class="nav-link" th:href="@{/reports}">Отчёты</a>
        </div>
        <form th:action="@{/auth/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-outline-light btn-sm">Выход</button>
        </form>
    </div>
</nav>
<div class="container mt-4" style="max-width:500px">
    <h3 class="mb-3" th:text="${application.id != null ? 'Редактировать заявку' : 'Новая заявка на снятие'}"></h3>
    <form th:action="${application.id != null ? '/applications/' + application.id + '/update' : '/applications/save'}" th:object="${application}" method="post">
        <div class="mb-3">
            <label for="delay" class="form-label">Задержка (дней)</label>
            <input type="number" id="delay" th:field="*{delay}" class="form-control" min="1" required/>
        </div>
        <div class="mb-3">
            <label for="withdrawalAmount" class="form-label">Сумма снятия</label>
            <input type="number" id="withdrawalAmount" th:field="*{withdrawalAmount}" class="form-control" min="1" required/>
        </div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a th:href="@{/applications}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
